AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CloudProjectMarker grades cloud projects, with opt-in AgentCore oral service
  practice isolated from existing task marks.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  EnableVoicePractice:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable QR-linked oral practice; upload the agent artifact before enabling.
  VoiceAgentCodeBucket:
    Type: String
    Default: voice-agent-not-configured
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: Private same-region bucket containing the packaged AgentCore Node.js code.
  VoiceAgentCodeKey:
    Type: String
    Default: not-configured.zip
    MinLength: 1
    Description: Immutable S3 key produced by admin/package_voice_agent.sh.
  VoiceModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    AllowedPattern: "(?:(?:us|eu|ap|global)[.])?amazon[.][a-zA-Z0-9.:-]+"
    Description: In-region Amazon Bedrock model or inference profile ID; confirm access before enabling.
  SecretHash:
    Type: String
    Description: Secret Hash value for the project
    Default: "THIS_IS_A_SECRET_HASH"

  ScheduleGrader:
    Type: String
    AllowedValues:
      - enable
      - disable
    Description: Enable Schedule Grader
    Default: disable

  ScheduleExpression:
    Type: String
    Description: Schedule Expression
    Default: cron(0 * * * ? *)
    AllowedValues:
      - cron(0/5 * * * ? *)
      - cron(0 * * * ? *)
      - cron(0 0 * * ? *)

Rules:
  VoiceAgentArtifactRequired:
    RuleCondition: !Equals [!Ref EnableVoicePractice, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref VoiceAgentCodeBucket, voice-agent-not-configured]]
        AssertDescription: Upload the AgentCore artifact and provide its bucket before enabling voice practice.
      - Assert: !Not [!Equals [!Ref VoiceAgentCodeKey, not-configured.zip]]
        AssertDescription: Provide the immutable AgentCore artifact key.

Conditions:
  VoicePracticeEnabled: !Equals [!Ref EnableVoicePractice, "true"]
  isEnableScheduleGrader: !Equals [ !Ref ScheduleGrader, enable ]

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    MemorySize: 1024
    Architectures: 
      - x86_64
    Runtime: dotnet8
    Timeout: 900
    Tracing: Active

Resources:
  VoicePracticeTable:
    Type: AWS::DynamoDB::Table
    Condition: VoicePracticeEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Isolate oral attempts, approved question banks and unique completion from task marks.
        must: [Enforce expiry in application code; TTL is delayed cleanup, Never store raw API keys]
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}

  VoiceAudioBucket:
    Type: AWS::S3::Bucket
    Condition: VoicePracticeEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Retired recording storage; preserve privacy and expire existing objects after removal of audio uploads.
        must: [Private and TLS-only, Expire recordings and transcripts after one day]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ShortAudioRetention
            Status: Enabled
            ExpirationInDays: 1
            NoncurrentVersionExpiration: {NoncurrentDays: 1}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  VoiceAudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: VoicePracticeEnabled
    Properties:
      Bucket: !Ref VoiceAudioBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt VoiceAudioBucket.Arn, !Sub "${VoiceAudioBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  VoiceAgentRole:
    Type: AWS::IAM::Role
    Condition: VoicePracticeEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Bounded generation and grading only; no tools or access to student tables.
        must: [Restrict inference to configured model, Only same-account AgentCore may assume]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock-agentcore.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
      Policies:
        - PolicyName: ModelAndCode
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${VoiceModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${VoiceModelId}"
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "arn:${AWS::Partition}:s3:::${VoiceAgentCodeBucket}/${VoiceAgentCodeKey}"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Effect: Allow
                Action: [kms:DescribeKey, kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:ReEncryptFrom, kms:ReEncryptTo]
                Resource: !GetAtt VoiceLogKey.Arn
                Condition: {StringEquals: {kms:ViaService: !Sub "logs.${AWS::Region}.amazonaws.com"}}

  VoiceAgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Condition: VoicePracticeEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Custom bounded HTTP agent deployed via CloudFormation, not the CDK-based CLI.
        must: [Authenticated IAM invocation from backend only, No browser credentials or reward tools]
    Properties:
      AgentRuntimeName: !Join ["_", !Split ["-", !Sub "${AWS::StackName}_voice"]]
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3: {Bucket: !Ref VoiceAgentCodeBucket, Prefix: !Ref VoiceAgentCodeKey}
          Runtime: NODE_22
          EntryPoint: [server.js]
      RoleArn: !GetAtt VoiceAgentRole.Arn
      NetworkConfiguration: {NetworkMode: PUBLIC}
      ProtocolConfiguration: HTTP
      EnvironmentVariables:
        VOICE_MODEL_ID: !Ref VoiceModelId

  VoiceAgentEndpoint:
    Type: AWS::BedrockAgentCore::RuntimeEndpoint
    Condition: VoicePracticeEnabled
    DependsOn: VoiceAgentLogGroup
    Properties:
      AgentRuntimeId: !GetAtt VoiceAgentRuntime.AgentRuntimeId
      AgentRuntimeVersion: !GetAtt VoiceAgentRuntime.AgentRuntimeVersion
      Name: live

  VoicePracticeFunction:
    Type: AWS::Serverless::Function
    Condition: VoicePracticeEnabled
    DependsOn: VoiceAgentLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Capability-scoped voice and authenticated game saves; async grading avoids API timeouts; checkpoint saves reuse retained player storage.
        must: [Browser STT only with no recording or Transcribe access, Server validates reading grades and rewards, Do not alter AWS task marks or historical participation, Atomic idempotent activity rewards and wallet casts with capacity 100, Completion summaries use authenticated owner only and exclude speech and capabilities, Game saves use conditional revisions and never grant MP or marks, Mission completion is verified against read-only passed tests]
    Properties:
      CodeUri: ./src/VoicePractice
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 1
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt VoiceFailureQueue.Arn
      Environment:
        Variables:
          VOICE_TABLE: !Ref VoicePracticeTable
          VOICE_AGENT_RUNTIME_ARN: !GetAtt VoiceAgentRuntime.AgentRuntimeArn
          VOICE_AGENT_QUALIFIER: live
          VOICE_MODEL_ID: !Ref VoiceModelId
          API_KEY_LOOKUP_TABLE: !Ref ApiKeyLookupTable
          PASSED_TEST_TABLE: !Ref PassedTestTable
          VOICE_WEB_ORIGIN: !Sub "https://${CloudFrontDistribution.DomainName}"
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query]
              Resource: !GetAtt VoicePracticeTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt ApiKeyLookupTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt PassedTestTable.Arn
            - Effect: Allow
              Action: [kms:DescribeKey, kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:ReEncryptFrom, kms:ReEncryptTo]
              Resource: !GetAtt VoiceLogKey.Arn
              Condition: {StringEquals: {kms:ViaService: !Sub "logs.${AWS::Region}.amazonaws.com"}}
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource: [!GetAtt VoiceAgentRuntime.AgentRuntimeArn, !Sub "${VoiceAgentRuntime.AgentRuntimeArn}/runtime-endpoint/live"]
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-VoicePracticeFunction-*"
      Events:
        GameSaveGet:
          Type: Api
          Properties: {Path: /game/save, Method: GET, RestApiId: !Ref ApiGatewayApi}
        GameSavePost:
          Type: Api
          Properties: {Path: /game/save, Method: POST, RestApiId: !Ref ApiGatewayApi}
        DesktopWallet:
          Type: Api
          Properties: {Path: /voice/wallet, Method: GET, RestApiId: !Ref ApiGatewayApi}
        DesktopCast:
          Type: Api
          Properties: {Path: /voice/casts, Method: POST, RestApiId: !Ref ApiGatewayApi}
        DesktopCompletions:
          Type: Api
          Properties: {Path: /voice/completions, Method: GET, RestApiId: !Ref ApiGatewayApi}
        CreateSession:
          Type: Api
          Properties: {Path: /voice/sessions, Method: POST, RestApiId: !Ref ApiGatewayApi}
        DesktopSession:
          Type: Api
          Properties: {Path: "/voice/sessions/{id}", Method: GET, RestApiId: !Ref ApiGatewayApi}
        DesktopAction:
          Type: Api
          Properties: {Path: "/voice/sessions/{id}/{action}", Method: POST, RestApiId: !Ref ApiGatewayApi}
        MobileGet:
          Type: Api
          Properties:
            Path: "/voice/mobile/{action}"
            Method: GET
            RestApiId: !Ref ApiGatewayApi
            Auth: {ApiKeyRequired: false}
        MobilePost:
          Type: Api
          Properties:
            Path: "/voice/mobile/{action}"
            Method: POST
            RestApiId: !Ref ApiGatewayApi
            Auth: {ApiKeyRequired: false}

  VoicePracticeLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: VoicePracticeEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${VoicePracticeFunction}"
      RetentionInDays: 14
      KmsKeyId: !GetAtt VoiceLogKey.Arn

  VoiceFailureQueue:
    Type: AWS::SQS::Queue
    Condition: VoicePracticeEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Retain exhausted asynchronous worker failures for operator diagnosis without automatic model loops.
        must: [Worker events contain identifiers only, Do not put recordings or transcripts on the queue]
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600

  VoiceAgentLogGroup:
    Type: Custom::VoiceAgentLogSettings
    Condition: VoicePracticeEnabled
    DependsOn: VoiceLogConfiguratorLogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: AgentCore creates its default log group itself; configure it instead of racing creation.
        must: [Encrypt both default and live endpoint logs before exposing backend, Preserve logs on deletion]
    Properties:
      ServiceToken: !GetAtt VoiceLogConfigurator.Arn
      LogGroupNames:
        - !Sub "/aws/bedrock-agentcore/runtimes/${VoiceAgentRuntime.AgentRuntimeId}-DEFAULT"
        - !Sub "/aws/bedrock-agentcore/runtimes/${VoiceAgentRuntime.AgentRuntimeId}-live"
      RetentionInDays: 14
      KmsKeyId: !GetAtt VoiceLogKey.Arn

  VoiceLogConfiguratorRole:
    Type: AWS::IAM::Role
    Condition: VoicePracticeEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Configure only this runtime's service-created log groups.
        must: [No log reading or deletion permissions, No access to student data]
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ConfigureRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:AssociateKmsKey, logs:PutRetentionPolicy]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${VoiceAgentRuntime.AgentRuntimeId}-*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-VoiceLogConfigurator-*"
              - Effect: Allow
                Action: [kms:DescribeKey, kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:ReEncryptFrom, kms:ReEncryptTo]
                Resource: !GetAtt VoiceLogKey.Arn
                Condition: {StringEquals: {kms:ViaService: !Sub "logs.${AWS::Region}.amazonaws.com"}}

  VoiceLogConfigurator:
    Type: AWS::Lambda::Function
    Condition: VoicePracticeEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Idempotently set encryption and retention on AgentCore-owned log groups.
        must: [Never delete logs, Return CloudFormation response for every operation]
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt VoiceLogConfiguratorRole.Arn
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Code:
        ZipFile: |
          const {CloudWatchLogsClient, CreateLogGroupCommand, AssociateKmsKeyCommand,
            PutRetentionPolicyCommand} = require("@aws-sdk/client-cloudwatch-logs");
          const logs = new CloudWatchLogsClient({});
          exports.handler = async (event) => {
            let Status = "SUCCESS";
            let Reason = "Runtime log settings applied.";
            const properties = event.ResourceProperties;
            try {
              if (event.RequestType !== "Delete") {
                for (const logGroupName of properties.LogGroupNames) {
                  try {
                    await logs.send(new CreateLogGroupCommand({
                      logGroupName, kmsKeyId: properties.KmsKeyId
                    }));
                  } catch (error) {
                    if (error.name !== "ResourceAlreadyExistsException") throw error;
                  }
                  await logs.send(new AssociateKmsKeyCommand({
                    logGroupName, kmsKeyId: properties.KmsKeyId
                  }));
                  await logs.send(new PutRetentionPolicyCommand({
                    logGroupName, retentionInDays: Number(properties.RetentionInDays)
                  }));
                }
              }
            } catch (error) {
              Status = "FAILED";
              Reason = ("Unable to configure runtime logs: " + error.name + ": " + error.message).slice(0, 1000);
            }
            const body = JSON.stringify({
              Status, Reason, PhysicalResourceId: event.PhysicalResourceId || properties.LogGroupNames[0],
              StackId: event.StackId, RequestId: event.RequestId,
              LogicalResourceId: event.LogicalResourceId
            });
            const response = await fetch(event.ResponseURL, {
              method: "PUT", headers: {"content-type": ""}, body
            });
            if (!response.ok) throw new Error("CloudFormation response failed");
          };

  VoiceLogConfiguratorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: VoicePracticeEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${VoiceLogConfigurator}"
      RetentionInDays: 14
      KmsKeyId: !GetAtt VoiceLogKey.Arn

  VoiceLogKey:
    Type: AWS::KMS::Key
    Condition: VoicePracticeEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Encrypt restricted voice processing logs; never intentionally log transcripts.
        must: [Restrict log-service use by encryption context, Retain key while encrypted logs exist]
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
          - Effect: Allow
            Principal: {Service: !Sub "logs.${AWS::Region}.amazonaws.com"}
            Action: [kms:Encrypt, kms:Decrypt, kms:ReEncryptFrom, kms:ReEncryptTo, kms:GenerateDataKey, kms:DescribeKey]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-VoicePracticeFunction-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-VoiceLogConfigurator-*"

  TestResultBucket:
    Type: AWS::S3::Bucket

  WebAppS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
  WebAppS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppS3Bucket
      PolicyDocument:
        Id: PolicyForCloudFrontPrivateContent
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${WebAppS3Bucket}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  WebAppOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-origin-access-control"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt WebAppS3Bucket.RegionalDomainName
            Id: !Sub "${WebAppS3Bucket}-web-app-s3-origin"
            OriginAccessControlId: !GetAtt WebAppOriginAccessControl.Id
            S3OriginConfig: {}
        Enabled: "true"
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: !Sub "${WebAppS3Bucket}-web-app-s3-origin"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
          ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_All
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  AwsAccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "User"
          AttributeType: "S"
        - AttributeName: "AwsAccountNumber"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "User"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: AwsAccountNumberIndex
          KeySchema:
          - AttributeName: "AwsAccountNumber"
            KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"

  InstructionCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "Id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "Id"
          KeyType: "HASH"    
      TimeToLiveSpecification:
        AttributeName: "TTL"
        Enabled: true

  PassedTestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "User"
          AttributeType: "S"
        - AttributeName: "Test"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "User"
          KeyType: "HASH"
        - AttributeName: "Test"
          KeyType: "RANGE"

  FailedTestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "User"
          AttributeType: "S"
        - AttributeName: "TestTime"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "User"
          KeyType: "HASH"
        - AttributeName: "TestTime"
          KeyType: "RANGE"

  ApiKeyLookupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "ApiKey"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "ApiKey"
          KeyType: "HASH"

  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: Prod
      # Include error CORS in the API definition so API updates cannot erase it.
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
              Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        MaxAge: "'600'"
        AllowCredentials: false
      TracingEnabled: true
      Auth:
        ApiKeyRequired: true
        AddApiKeyRequiredToCorsPreflight: false

  # Gateway Responses to add CORS headers to error responses
  ApiGatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponse5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: UNAUTHORIZED
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponseMissingAuthToken:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: MISSING_AUTHENTICATION_TOKEN
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponseForbidden:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: ACCESS_DENIED
      RestApiId: !Ref ApiGatewayApi

  ApiGatewayResponseInvalidApiKey:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: INVALID_API_KEY
      RestApiId: !Ref ApiGatewayApi
        
  APIUsagePlan:
    Type: 'AWS::ApiGateway::UsagePlan'
    Properties:
      ApiStages:
        - ApiId: !Ref ApiGatewayApi
          Stage: !Ref ApiGatewayApi.Stage
      Description: To usage plan and api key in REST API.
      Quota:
        Limit: 2880
        Period: DAY
      Throttle:
        BurstLimit: 60
        RateLimit: 60
      UsagePlanName: "grader-usage-plan"

  GameFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/ServerlessAPI
      Handler: ServerlessAPI::ServerlessAPI.Functions.GameFunction::FunctionHandler
      Policies:
        - Statement:
          - Effect: Allow
            Action: 'bedrock:*'
            Resource: '*'
        - DynamoDBCrudPolicy:
            TableName: !Ref PassedTestTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FailedTestTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AwsAccountTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InstructionCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyLookupTable
        - Statement:
          - Effect: "Allow"
            Action:
              - "apigateway:GET"
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"
      Environment:
        Variables:
          PASSED_TEST_TABLE: !Ref PassedTestTable
          FAILED_TEST_TABLE: !Ref FailedTestTable
          AWS_ACCOUNT_TABLE: !Ref AwsAccountTable
          INSTRUCTION_CACHE_TABLE: !Ref InstructionCacheTable
          API_KEY_LOOKUP_TABLE: !Ref ApiKeyLookupTable
          SECRET_HASH: !Ref SecretHash 
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /game
            Method: GET
            RestApiId:
              Ref: ApiGatewayApi
            Auth:
              ApiKeyRequired: true
        ProxyApiCors:
          Type: Api
          Properties:
            RestApiId:
              Ref: ApiGatewayApi
            Path: /game
            Method: options
            Auth:
              ApiKeyRequired: false

  KeyGenApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-key-api"
      StageName: Prod

  KeyGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/ServerlessAPI
      Handler: ServerlessAPI::ServerlessAPI.Functions.KeyGenFunction::FunctionHandler
      Environment:
        Variables:
          RestApiId: !Ref ApiGatewayApi
          SECRET_HASH: !Ref SecretHash
          UsagePlanId: !Ref APIUsagePlan
          API_KEY_LOOKUP_TABLE: !Ref ApiKeyLookupTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ApiKeyLookupTable
        - Statement:
          - Effect: "Allow"
            Action:
              - "apigateway:POST"
              - "apigateway:GET"
              - "apigateway:DELETE"
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"             
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys/*" 
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: KeyGenApiGatewayApi
            Path: /keygen
            Method: get

