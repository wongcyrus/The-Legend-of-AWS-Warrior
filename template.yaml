  ResetMarksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Students restart their own grading progress without replacing keys or account links.
        must:
          - Derive the student exclusively from the validated API key; never accept a target user.
          - Delete only that student's passed and failed records; never scan or delete tables.
    Properties:
      CodeUri: ./src/ServerlessAPI
      Handler: ServerlessAPI::ServerlessAPI.Functions.ResetMarksFunction::ResetMarksHandler
      Timeout: 29
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:DeleteItem
            Resource:
              - !GetAtt PassedTestTable.Arn
              - !GetAtt FailedTestTable.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
            Resource: !GetAtt ApiKeyLookupTable.Arn
          - Effect: Allow
            Action: apigateway:GET
            Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
      Environment:
        Variables:
          PASSED_TEST_TABLE: !Ref PassedTestTable
          FAILED_TEST_TABLE: !Ref FailedTestTable
          API_KEY_LOOKUP_TABLE: !Ref ApiKeyLookupTable
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /resetmarks
            Method: POST
            Auth:
              ApiKeyRequired: true
        ProxyApiCors:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /resetmarks
            Method: options
            Auth:
              ApiKeyRequired: false

  StepFunctionGraderFunction:
