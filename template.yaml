      Handler: ServerlessAPI::ServerlessAPI.Functions.GraderFunction::StepFunctionHandler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref TestResultBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PassedTestTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FailedTestTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AwsAccountTable
      Environment:
        Variables:
          TEST_RESULT_Bucket: !Ref TestResultBucket
          PASSED_TEST_TABLE: !Ref PassedTestTable
          FAILED_TEST_TABLE: !Ref FailedTestTable
          AWS_ACCOUNT_TABLE: !Ref AwsAccountTable
          SECRET_HASH: !Ref SecretHash

  GradeAllStudentsStateMachine:
    Type: AWS::Serverless::StateMachine
    Condition: isEnableScheduleGrader
    Properties:
      DefinitionSubstitutions:
        StepFunctionGraderFunctionArn: !GetAtt StepFunctionGraderFunction.Arn
        AWS_ACCOUNT_TABLE: !Ref AwsAccountTable
      Policies:      
        - LambdaInvokePolicy:
            FunctionName: !Ref StepFunctionGraderFunction
        - DynamoDBCrudPolicy:
            TableName: !Ref AwsAccountTable    
      DefinitionUri: ./src/statemachine/grader.asl.json
      Events:
        ScheduleEvent:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: !Ref ScheduleExpression


  ApplicationResourceGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name:
        Fn::Sub: ApplicationInsights-SAM-${AWS::StackName}
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
  ApplicationInsightsMonitoring:
    Type: AWS::ApplicationInsights::Application
    Properties:
      ResourceGroupName:
        Ref: ApplicationResourceGroup
      AutoConfigurationEnabled: "true"

Outputs:
  VoicePracticeTableName:
    Condition: VoicePracticeEnabled
    Description: Question review and oral practice records; not the AWS task grade table.
    Value: !Ref VoicePracticeTable
  VoicePracticeRuntimeArn:
    Condition: VoicePracticeEnabled
    Value: !GetAtt VoiceAgentRuntime.AgentRuntimeArn
  VoicePracticeAudioBucketName:
    Condition: VoicePracticeEnabled
    Value: !Ref VoiceAudioBucket
  VoicePracticeFunctionName:
    Condition: VoicePracticeEnabled
    Value: !Ref VoicePracticeFunction
  WebApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/"
  KeygenApiEndpoint:
    Description: Keygen API Gateway endpoint URL
    Value: !Sub "https://${KeyGenApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/keygen?hash=${SecretHash}&email="
  KeyTestApiEndpoint:
    Description: Key Test API Gateway endpoint URL (requires x-api-key header)
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/keytest?email="
  
  UsagePlanId:
    Description: API Gateway Usage Plan ID
    Value: !Ref APIUsagePlan
  UsagePlanName:
    Description: API Gateway Usage Plan Name
    Value: "grader-usage-plan"
  TestResultBucket:
    Description: Test Result Bucket
    Value: !Ref TestResultBucket
  PassedTestTable:
    Description: Passed Test Table
    Value: !Ref PassedTestTable
  FailedTestTable:
    Description: Failed Test Table
    Value: !Ref FailedTestTable
  ApiKeyLookupTable:
    Description: API Key Lookup Table
    Value: !Ref ApiKeyLookupTable
  WebAppDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
  CloudFrontDistributionId:
    Value: !GetAtt CloudFrontDistribution.Id
  WebAppS3BucketName:
    Value: !Ref WebAppS3Bucket
